name: Security

on:
  push:
  pull_request:
  workflow_call: {}

jobs:
  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Audit installed dependencies
        # pyjwt (transitive via mcp): PYSEC-2025-183 is disputed by the supplier;
        # no fixed release. Track upstream mcp/pyjwt updates instead of blocking CI.
        run: python -m pip_audit --desc on --ignore-vuln PYSEC-2025-183

  bandit:
    name: Static analysis (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install "bandit[toml]>=1.8.0"

      - name: Scan application source (medium severity and above)
        run: python -m bandit -r src/outlook_desktop_mcp -ll -c pyproject.toml
